# Vendors = the allow-listed Reap merchants (backend/seed/allowed_merchants.tsv).
# Resolved by probing the Reap SG sandbox POST /agentic/products/search on 2026-10-09.
#
# Fields:
#   domain              merchant domain; ALSO the value to send as merchantPreference.merchantName
#                       (verified: every domain below resolves; display names often do NOT, e.g.
#                       "Popular Bookstore" -> MERCHANT_NOT_RESOLVED, "popular.com.sg" -> OK).
#   reap_merchant_name  exact products[].merchant.name returned by search; used to filter/attribute
#                       offers. Empty = merchant not found in sandbox.
#   priority            lower = more preferred (tie-breaker in ranking).
#   allowed             may be bought from. office_relevant = returned products for office queries.
#   probe_notes         what the probe found.
