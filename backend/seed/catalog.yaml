# Approved items catalog (seed). Every preferred vendor is an allow-listed merchant that returned
# a matching, available product in the Reap SG sandbox probe on 2026-10-09 (prices in SGD seen then).
#
# Fields:
#   sku                 stable slug, unique; used as the natural key by the seed loader (upsert).
#   name, aliases       used for catalog matching (exact sku -> name/alias fuzzy -> off-list).
#   category            Paper & Stationery | Coffee & Tea | Pantry & Snacks | Cleaning & Hygiene | Electronics & Office
#   unit                human description of one purchasable unit (what qty counts).
#   default_qty         used when the requester says "the usual" / no quantity.
#   max_unit_price_sgd  policy ceiling per unit, decimal SGD; loader converts to integer cents (round half up).
#   preferred_vendors   vendor domains in preference order (see vendors.yaml).
#   auto_approve        false => always NEEDS_APPROVAL even when within limits.
#   search_query        query sent to Reap /agentic/products/search with merchantPreference {ONLY, domain}.
#   probe_seen          example product + price observed during the probe (documentation only).
